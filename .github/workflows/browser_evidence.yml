name: Browser Evidence On-Demand

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to test'
        required: true
        default: 'main'
      scenarios:
        description: 'Comma-separated scenario IDs, all, or changed'
        required: true
        default: 'session-chat-mixed'
      viewport:
        description: 'Viewport preset'
        type: choice
        options:
          - desktop
          - mobile
        default: 'desktop'

jobs:
  run-evidence:
    name: Run Browser Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Execute Evidence Scenarios
        working-directory: client
        run: npm run evidence -- --scenarios "$SCENARIOS" --viewport "$VIEWPORT"
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          VIEWPORT: ${{ github.event.inputs.viewport }}
          EVIDENCE_REQUESTED_REF: ${{ github.event.inputs.ref }}

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence-${{ github.run_id }}
          path: |
            client/playwright-report/
            client/test-results/
            review-evidence/
          if-no-files-found: warn
          retention-days: 14
