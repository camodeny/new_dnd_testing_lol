name: CI

# Required PR CI for #286 — intentionally small and conventional.
# - Stable job names `backend` / `frontend` for branch protection.
# - No paid model calls, no production secrets, disposable Postgres only.
# - Heavier suites (#267/#270/#273) should be added as separate
#   `workflow_dispatch`/`schedule` workflows reusing the same
#   setup-python/setup-node/postgres conventions — not as required PR jobs.
# - Local equivalents: `scripts/ci/backend.sh` and `scripts/ci/frontend.sh`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_test:ci_test@localhost:5432/ci_test?sslmode=disable
      POSTGRES_URL_NON_POOLING: postgresql://ci_test:ci_test@localhost:5432/ci_test?sslmode=disable
      ALLOW_MOCK_AUTH: "true"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend checks (static + migrate + tests)
        run: set -o pipefail; bash scripts/ci/backend.sh 2>&1 | tee /tmp/pytest-backend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-logs
          path: |
            /tmp/pytest-backend.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks (lint + typecheck + build)
        run: set -o pipefail; bash scripts/ci/frontend.sh 2>&1 | tee /tmp/frontend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-logs
          path: /tmp/frontend.log
          if-no-files-found: ignore
          retention-days: 7
