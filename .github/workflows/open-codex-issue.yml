name: Open Codex task for new issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: codex-issue-launcher
  cancel-in-progress: false

jobs:
  open-codex-task:
    # A self-hosted runner can execute on this Mac, so only the repository owner
    # may turn an issue into a local Codex task.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.repository_owner
    runs-on: [self-hosted, macOS, codex-desktop]
    timeout-minutes: 185
    env:
      CODEX_REPO_PATH: ${{ vars.CODEX_REPO_PATH }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Verify launcher configuration
        shell: bash
        run: |
          test -n "$CODEX_REPO_PATH"
          test -d "$CODEX_REPO_PATH"
          test -x "$HOME/Library/Application Support/CodexIssueLauncher/bin/codex_issue_launcher.py"

      - name: Create isolated worktree and open Codex
        shell: bash
        run: |
          "$HOME/Library/Application Support/CodexIssueLauncher/bin/codex_issue_launcher.py" create \
            --repo-path "$CODEX_REPO_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-body "$ISSUE_BODY"
