name: DND AI PR Review

# This is deliberately pull_request_target: the workflow checks out only the
# trusted base branch and never executes code from the incoming PR on the
# self-hosted runner, which holds an authenticated ChatGPT browser profile.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Each self-hosted runner on the Pi owns a persistent ChatGPT browser
# profile (see the profile step below), so different pull requests can be
# reviewed in parallel. Pushes to the same PR stay serialized.
concurrency:
  group: dnd-ai-review-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review with DND AI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, ARM64, raspone-ci]
    timeout-minutes: 20
    steps:
      - name: Check out trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reviewer-source
          sparse-checkout: |
            .github/ai-review
          sparse-checkout-cone-mode: false

      - name: Install reviewer dependency
        working-directory: reviewer-source/.github/ai-review
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test reviewer helpers
        working-directory: reviewer-source/.github/ai-review
        run: npm test

      - name: Select this runner's ChatGPT profile
        # Chromium locks a user-data-dir, so concurrent reviews must each
        # use their own persistent profile. raspone-ci-2 uses profile-2;
        # every other runner keeps the original profile.
        run: |
          if [ "${{ runner.name }}" = "raspone-ci-2" ]; then
            echo "CHATGPT_PROFILE_DIR=/home/cpendergrass/.aireview-chatgpt-profile-2" >> "$GITHUB_ENV"
          else
            echo "CHATGPT_PROFILE_DIR=/home/cpendergrass/.aireview-chatgpt-profile" >> "$GITHUB_ENV"
          fi

      - name: Ask DND AI to review and submit the PR review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHATGPT_PROJECT: DND AI AUTO
          CHATGPT_HEADLESS: "false"
          CHATGPT_RESPONSE_TIMEOUT_MS: "600000"
          REVIEWER_DIAGNOSTICS_DIR: /tmp/dnd-ai-review-diagnostics-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$REVIEWER_DIAGNOSTICS_DIR"
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1024x24" \
            node reviewer-source/.github/ai-review/review_pr.js

      - name: Upload reviewer diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dnd-ai-review-diagnostics-${{ github.run_id }}
          path: /tmp/dnd-ai-review-diagnostics-${{ github.run_id }}/
          if-no-files-found: ignore
          retention-days: 14
