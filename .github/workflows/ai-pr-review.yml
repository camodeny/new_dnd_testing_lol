name: DND AI PR Review

# This is deliberately pull_request_target: the workflow checks out only the
# trusted base branch and never executes code from the incoming PR on the
# self-hosted runner, which holds an authenticated ChatGPT browser profile.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# There is one persistent browser profile on the Pi, so reviews must be
# serialized across pull requests.
concurrency:
  group: dnd-ai-chatgpt-browser
  cancel-in-progress: false

jobs:
  review:
    name: Review with DND AI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, ARM64, raspone-ci]
    timeout-minutes: 20
    steps:
      - name: Check out trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reviewer-source
          sparse-checkout: |
            .github/ai-review
          sparse-checkout-cone-mode: false

      - name: Install reviewer dependency
        working-directory: reviewer-source/.github/ai-review
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ask DND AI to review and submit the PR review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHATGPT_PROJECT: DND AI AUTO
          CHATGPT_HEADLESS: "false"
          CHATGPT_RESPONSE_TIMEOUT_MS: "600000"
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1024x24" \
            node reviewer-source/.github/ai-review/review_pr.js
