name: Legacy System PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "legacy_system/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: legacy-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build legacy client
    runs-on: [self-hosted, Linux, ARM64, raspone-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: legacy_system/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: legacy_system/client
        run: npm ci

      - name: Lint frontend
        continue-on-error: true
        working-directory: legacy_system/client
        run: npm run lint

      - name: Build frontend
        working-directory: legacy_system/client
        run: npm run build
