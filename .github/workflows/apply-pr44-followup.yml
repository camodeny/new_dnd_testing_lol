name: Apply PR 44 follow-up

on:
  push:
    branches:
      - feature/sqlite-concurrency-hardening
    paths:
      - tools/apply_pr44_followup.py
      - .github/workflows/apply-pr44-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sqlite-concurrency-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_pr44_followup.py
      - run: python -m py_compile server/routes/automation.py server/tests/test_sqlite_hardening.py
      - name: Commit follow-up
        run: |
          rm tools/apply_pr44_followup.py
          rm .github/workflows/apply-pr44-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SQLite review follow-up regressions"
          git push origin HEAD:feature/sqlite-concurrency-hardening
