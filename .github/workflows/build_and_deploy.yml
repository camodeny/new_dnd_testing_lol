name: Build, Test, and Deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        run: |
          set -o pipefail
          mkdir -p test-logs
          python -m unittest discover -s server/tests -p "test_*.py" 2>&1 | tee test-logs/python.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: |
          set -o pipefail
          mkdir -p ../test-logs
          npm run build 2>&1 | tee ../test-logs/client-build.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build-info.json
        run: |
          mkdir -p client/public
          cat > client/public/build-info.json <<EOF
          {
            "version": "${{ github.ref_name }}",
            "short": "$(echo '${{ github.sha }}' | cut -c1-7)",
            "sha": "${{ github.sha }}",
            "time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "environment": "main"
          }
          EOF
          cat client/public/build-info.json

      - name: Validate deployment configuration
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
        run: |
          set -eu
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${TS_SERVER:?TS_SERVER_ADDRESS secret is required}"
          : "${TS_OAUTH_CLIENT_ID:?TS_OAUTH_CLIENT_ID secret is required}"
          : "${TS_OAUTH_SECRET:?TS_OAUTH_SECRET secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${SECRET_KEY:?SECRET_KEY secret is required}"
          LLM_PROVIDER="${LLM_PROVIDER:-openrouter}"
          case "${LLM_PROVIDER}" in
            openrouter)
              : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY secret is required when LLM_PROVIDER=openrouter}"
              : "${OPENROUTER_MODEL:?OPENROUTER_MODEL secret is required when LLM_PROVIDER=openrouter}"
              ;;
            opencode_go)
              : "${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY secret is required when LLM_PROVIDER=opencode_go}"
              : "${OPENCODE_GO_MODEL:?OPENCODE_GO_MODEL variable is required when LLM_PROVIDER=opencode_go}"
              ;;
            *)
              echo "Unsupported LLM_PROVIDER: ${LLM_PROVIDER}" >&2
              exit 1
              ;;
          esac
          echo "Deployment configuration is present."

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Ship repo files to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/new_dnd_testing_lol}"
          tmp_dir="$(mktemp -d)"
          tmp_tgz="${tmp_dir}/app.tgz"
          tar -czf "$tmp_tgz" \
            --exclude-vcs \
            --exclude='.env' \
            --exclude='*.env' \
            --exclude='data' \
            --exclude='node_modules' \
            --exclude='client/node_modules' \
            --exclude='client/dist' \
            --exclude='server/__pycache__' \
            .
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "mkdir -p '${DEPLOY_PATH}'"
          scp -o StrictHostKeyChecking=no "$tmp_tgz" "${DEPLOY_USER}@${TS_SERVER}:${DEPLOY_PATH}/app.tgz"
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "cd '${DEPLOY_PATH}' && tar -xzf app.tgz && rm app.tgz"

      - name: Build image and restart on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: ${{ vars.APP_PORT }}
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
          PUBLIC_APP_BASE_URL: ${{ vars.PUBLIC_APP_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_EXPIRATION_HOURS: ${{ vars.JWT_EXPIRATION_HOURS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_THINKING: ${{ vars.OPENCODE_GO_THINKING }}
          OPENCODE_GO_REASONING_EFFORT: ${{ vars.OPENCODE_GO_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/new_dnd_testing_lol}"
          APP_PORT="${APP_PORT:-5889}"
          FRONTEND_ORIGINS="${FRONTEND_ORIGINS:-http://localhost:${APP_PORT}}"
          PUBLIC_APP_BASE_URL="${PUBLIC_APP_BASE_URL:-http://localhost:${APP_PORT}}"
          JWT_EXPIRATION_HOURS="${JWT_EXPIRATION_HOURS:-24}"
          LLM_PROVIDER="${LLM_PROVIDER:-openrouter}"
          OPENCODE_GO_THINKING="${OPENCODE_GO_THINKING:-disabled}"
          OPENCODE_GO_REASONING_EFFORT="${OPENCODE_GO_REASONING_EFFORT:-high}"

          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "cd '${DEPLOY_PATH}' && umask 077 && cat > .deploy.env" <<EOF
          APP_PORT=${APP_PORT}
          FRONTEND_ORIGINS=${FRONTEND_ORIGINS}
          PUBLIC_APP_BASE_URL=${PUBLIC_APP_BASE_URL}
          DATABASE_URL=${DATABASE_URL}
          SECRET_KEY=${SECRET_KEY}
          JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
          LLM_PROVIDER=${LLM_PROVIDER}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          OPENROUTER_MODEL=${OPENROUTER_MODEL}
          OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
          OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL}
          OPENCODE_GO_THINKING=${OPENCODE_GO_THINKING}
          OPENCODE_GO_REASONING_EFFORT=${OPENCODE_GO_REASONING_EFFORT}
          EOF

          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "\
            cd '${DEPLOY_PATH}' && \
            docker build -t dnd-app:${IMAGE_TAG} . && \
            sed -i 's|image:[[:space:]]*dnd-app:.*|image: dnd-app:${IMAGE_TAG}|g' docker-compose.yml && \
            docker compose --env-file .deploy.env up -d && \
            for attempt in \$(seq 1 30); do \
              if docker compose --env-file .deploy.env exec -T app python -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5).read().decode())\"; then \
                break; \
              fi; \
              if [ \"\$attempt\" -eq 30 ]; then \
                docker compose --env-file .deploy.env ps; \
                docker compose --env-file .deploy.env logs --tail=200 app; \
                exit 1; \
              fi; \
              sleep 2; \
            done && \
            docker image prune -af \
          "
