name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: [self-hosted, Linux, ARM64, raspone-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use runner Python 3.12
        run: |
          CI_PYTHON="$HOME/.local/share/uv/python/cpython-3.12-linux-aarch64-gnu/bin/python3.12"
          test -x "$CI_PYTHON"
          echo "CI_PYTHON=$CI_PYTHON" >> "$GITHUB_ENV"
          echo "CI_VENV=$RUNNER_TEMP/dnd-ci-venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        working-directory: server
        run: |
          "$CI_PYTHON" -m venv "$CI_VENV"
          "$CI_VENV/bin/python" -m pip install --upgrade pip
          "$CI_VENV/bin/python" -m pip install -r requirements-dev.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        run: |
          set -o pipefail
          mkdir -p test-logs
          "$CI_VENV/bin/python" -m pytest server/tests -q 2>&1 | tee test-logs/python.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: |
          set -o pipefail
          mkdir -p ../test-logs
          npm run build 2>&1 | tee ../test-logs/client-build.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs

  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, ARM64, raspone-ci]
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build-info.json
        run: |
          mkdir -p client/public
          cat > client/public/build-info.json <<EOF
          {
            "version": "${{ github.ref_name }}",
            "short": "$(echo '${{ github.sha }}' | cut -c1-7)",
            "sha": "${{ github.sha }}",
            "time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}",
            "environment": "main"
          }
          EOF
          cat client/public/build-info.json

      - name: Validate deployment configuration
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SSO_URL: ${{ vars.SSO_URL }}
          REDIRECT_URI: ${{ vars.REDIRECT_URI }}
          AUTH_COOKIE_SECURE: ${{ vars.AUTH_COOKIE_SECURE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDINGS_ENABLED: ${{ vars.GEMINI_EMBEDDINGS_ENABLED }}
        run: |
          set -eu
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${TS_SERVER:?TS_SERVER_ADDRESS secret is required}"
          : "${TS_OAUTH_CLIENT_ID:?TS_OAUTH_CLIENT_ID secret is required}"
          : "${TS_OAUTH_SECRET:?TS_OAUTH_SECRET secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${SECRET_KEY:?SECRET_KEY secret is required}"
          : "${OPENAI_API_KEY:?OPENAI_API_KEY secret is required for encounter map generation}"
          if [ -n "${SSO_URL:-}${REDIRECT_URI:-}${CLIENT_ID:-}${CLIENT_SECRET:-}" ]; then
            : "${SSO_URL:?SSO_URL variable is required when Pendergrass SSO is enabled}"
            : "${REDIRECT_URI:?REDIRECT_URI variable is required when Pendergrass SSO is enabled}"
            : "${CLIENT_ID:?CLIENT_ID secret is required when Pendergrass SSO is enabled}"
            : "${CLIENT_SECRET:?CLIENT_SECRET secret is required when Pendergrass SSO is enabled}"
          fi
          GEMINI_EMBEDDINGS_ENABLED="${GEMINI_EMBEDDINGS_ENABLED:-true}"
          if [ "${GEMINI_EMBEDDINGS_ENABLED}" != "false" ]; then
            : "${GEMINI_API_KEY:?GEMINI_API_KEY secret is required when GEMINI_EMBEDDINGS_ENABLED is not false}"
          fi
          LLM_PROVIDER="${LLM_PROVIDER:-openrouter}"
          case "${LLM_PROVIDER}" in
            openrouter)
              : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY secret is required when LLM_PROVIDER=openrouter}"
              : "${OPENROUTER_MODEL:?OPENROUTER_MODEL secret is required when LLM_PROVIDER=openrouter}"
              ;;
            opencode_go)
              : "${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY secret is required when LLM_PROVIDER=opencode_go}"
              : "${OPENCODE_GO_MODEL:?OPENCODE_GO_MODEL variable is required when LLM_PROVIDER=opencode_go}"
              ;;
            *)
              echo "Unsupported LLM_PROVIDER: ${LLM_PROVIDER}" >&2
              exit 1
              ;;
          esac
          echo "Deployment configuration is present."

      - name: Join tailnet
        if: ${{ runner.environment != 'self-hosted' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify existing tailnet connection
        if: ${{ runner.environment == 'self-hosted' }}
        run: tailscale status --json >/dev/null

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Ship repo files to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/new_dnd_testing_lol}"
          tmp_dir="$(mktemp -d)"
          tmp_tgz="${tmp_dir}/app.tgz"
          tar -czf "$tmp_tgz" \
            --exclude-vcs \
            --exclude='.env' \
            --exclude='*.env' \
            --exclude='data' \
            --exclude='node_modules' \
            --exclude='client/node_modules' \
            --exclude='client/dist' \
            --exclude='server/__pycache__' \
            .
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "mkdir -p '${DEPLOY_PATH}'"
          scp -o StrictHostKeyChecking=no "$tmp_tgz" "${DEPLOY_USER}@${TS_SERVER}:${DEPLOY_PATH}/app.tgz"
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "cd '${DEPLOY_PATH}' && tar -xzf app.tgz && rm app.tgz"

      - name: Build image and restart on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_SERVER: ${{ secrets.TS_SERVER_ADDRESS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: ${{ vars.APP_PORT }}
          GUNICORN_TIMEOUT: ${{ vars.GUNICORN_TIMEOUT }}
          WORKER_REPLICAS: ${{ vars.WORKER_REPLICAS }}
          FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS }}
          PUBLIC_APP_BASE_URL: ${{ vars.PUBLIC_APP_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_EXPIRATION_HOURS: ${{ vars.JWT_EXPIRATION_HOURS }}
          SSO_URL: ${{ vars.SSO_URL }}
          REDIRECT_URI: ${{ vars.REDIRECT_URI }}
          AUTH_COOKIE_SECURE: ${{ vars.AUTH_COOKIE_SECURE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          OPENAI_IMAGE_TIMEOUT_SECONDS: ${{ vars.OPENAI_IMAGE_TIMEOUT_SECONDS }}
          OPENAI_IMAGE_QA_ENABLED: ${{ vars.OPENAI_IMAGE_QA_ENABLED }}
          OPENAI_IMAGE_QA_MODEL: ${{ vars.OPENAI_IMAGE_QA_MODEL }}
          OPENAI_IMAGE_QA_THRESHOLD: ${{ vars.OPENAI_IMAGE_QA_THRESHOLD }}
          OPENAI_IMAGE_QA_MAX_RETRIES: ${{ vars.OPENAI_IMAGE_QA_MAX_RETRIES }}
          OPENAI_IMAGE_QA_TIMEOUT_SECONDS: ${{ vars.OPENAI_IMAGE_QA_TIMEOUT_SECONDS }}
          OPENAI_IMAGE_GRID_VALIDATION_ENABLED: ${{ vars.OPENAI_IMAGE_GRID_VALIDATION_ENABLED }}
          OPENAI_IMAGE_GRID_MAX_RETRIES: ${{ vars.OPENAI_IMAGE_GRID_MAX_RETRIES }}
          OPENAI_IMAGE_SETUP_MODEL: ${{ vars.OPENAI_IMAGE_SETUP_MODEL }}
          OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS: ${{ vars.OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS }}
          ENCOUNTER_MAP_STORAGE_DIR: ${{ vars.ENCOUNTER_MAP_STORAGE_DIR }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_THINKING: ${{ vars.OPENCODE_GO_THINKING }}
          OPENCODE_GO_REASONING_EFFORT: ${{ vars.OPENCODE_GO_REASONING_EFFORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
          GEMINI_EMBEDDINGS_ENABLED: ${{ vars.GEMINI_EMBEDDINGS_ENABLED }}
          GEMINI_EMBEDDING_DIMENSIONS: ${{ vars.GEMINI_EMBEDDING_DIMENSIONS }}
          MEMORY_EMBEDDING_DEDUPE_THRESHOLD: ${{ vars.MEMORY_EMBEDDING_DEDUPE_THRESHOLD }}
          MEMORY_EMBEDDING_SEARCH_WEIGHT: ${{ vars.MEMORY_EMBEDDING_SEARCH_WEIGHT }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/new_dnd_testing_lol}"
          APP_PORT="${APP_PORT:-5889}"
          GUNICORN_TIMEOUT="${GUNICORN_TIMEOUT:-420}"
          WORKER_REPLICAS="${WORKER_REPLICAS:-4}"
          case "${WORKER_REPLICAS}" in
            ''|*[!0-9]*)
              echo "WORKER_REPLICAS must be a positive integer" >&2
              exit 1
              ;;
          esac
          if [ "${WORKER_REPLICAS}" -lt 1 ]; then
            echo "WORKER_REPLICAS must be at least 1" >&2
            exit 1
          fi
          FRONTEND_ORIGINS="${FRONTEND_ORIGINS:-http://localhost:${APP_PORT}}"
          PUBLIC_APP_BASE_URL="${PUBLIC_APP_BASE_URL:-http://localhost:${APP_PORT}}"
          JWT_EXPIRATION_HOURS="${JWT_EXPIRATION_HOURS:-24}"
          AUTH_COOKIE_SECURE="${AUTH_COOKIE_SECURE:-false}"
          LLM_PROVIDER="${LLM_PROVIDER:-openrouter}"
          OPENCODE_GO_THINKING="${OPENCODE_GO_THINKING:-disabled}"
          OPENCODE_GO_REASONING_EFFORT="${OPENCODE_GO_REASONING_EFFORT:-high}"
          OPENAI_IMAGE_QUALITY="${OPENAI_IMAGE_QUALITY:-low}"
          OPENAI_IMAGE_TIMEOUT_SECONDS="${OPENAI_IMAGE_TIMEOUT_SECONDS:-240}"
          OPENAI_IMAGE_QA_ENABLED="${OPENAI_IMAGE_QA_ENABLED:-true}"
          OPENAI_IMAGE_QA_MODEL="${OPENAI_IMAGE_QA_MODEL:-gpt-5.4}"
          OPENAI_IMAGE_QA_THRESHOLD="${OPENAI_IMAGE_QA_THRESHOLD:-8}"
          OPENAI_IMAGE_QA_MAX_RETRIES="${OPENAI_IMAGE_QA_MAX_RETRIES:-1}"
          OPENAI_IMAGE_QA_TIMEOUT_SECONDS="${OPENAI_IMAGE_QA_TIMEOUT_SECONDS:-90}"
          OPENAI_IMAGE_GRID_VALIDATION_ENABLED="${OPENAI_IMAGE_GRID_VALIDATION_ENABLED:-true}"
          OPENAI_IMAGE_GRID_MAX_RETRIES="${OPENAI_IMAGE_GRID_MAX_RETRIES:-2}"
          OPENAI_IMAGE_SETUP_MODEL="${OPENAI_IMAGE_SETUP_MODEL:-gpt-5.4}"
          OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS="${OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS:-90}"
          ENCOUNTER_MAP_STORAGE_DIR="${ENCOUNTER_MAP_STORAGE_DIR:-/app/data/encounter_maps}"
          GEMINI_EMBEDDING_MODEL="${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
          GEMINI_EMBEDDINGS_ENABLED="${GEMINI_EMBEDDINGS_ENABLED:-true}"
          GEMINI_EMBEDDING_DIMENSIONS="${GEMINI_EMBEDDING_DIMENSIONS:-768}"
          MEMORY_EMBEDDING_DEDUPE_THRESHOLD="${MEMORY_EMBEDDING_DEDUPE_THRESHOLD:-0.90}"
          MEMORY_EMBEDDING_SEARCH_WEIGHT="${MEMORY_EMBEDDING_SEARCH_WEIGHT:-0.70}"

          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "cd '${DEPLOY_PATH}' && umask 077 && cat > .deploy.env" <<EOF
          APP_PORT=${APP_PORT}
          GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT}
          FRONTEND_ORIGINS=${FRONTEND_ORIGINS}
          PUBLIC_APP_BASE_URL=${PUBLIC_APP_BASE_URL}
          DATABASE_URL=${DATABASE_URL}
          SECRET_KEY=${SECRET_KEY}
          JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
          SSO_URL=${SSO_URL}
          REDIRECT_URI=${REDIRECT_URI}
          AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
          CLIENT_ID=${CLIENT_ID}
          CLIENT_SECRET=${CLIENT_SECRET}
          LLM_PROVIDER=${LLM_PROVIDER}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          OPENROUTER_MODEL=${OPENROUTER_MODEL}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY}
          OPENAI_IMAGE_TIMEOUT_SECONDS=${OPENAI_IMAGE_TIMEOUT_SECONDS}
          OPENAI_IMAGE_QA_ENABLED=${OPENAI_IMAGE_QA_ENABLED}
          OPENAI_IMAGE_QA_MODEL=${OPENAI_IMAGE_QA_MODEL}
          OPENAI_IMAGE_QA_THRESHOLD=${OPENAI_IMAGE_QA_THRESHOLD}
          OPENAI_IMAGE_QA_MAX_RETRIES=${OPENAI_IMAGE_QA_MAX_RETRIES}
          OPENAI_IMAGE_QA_TIMEOUT_SECONDS=${OPENAI_IMAGE_QA_TIMEOUT_SECONDS}
          OPENAI_IMAGE_GRID_VALIDATION_ENABLED=${OPENAI_IMAGE_GRID_VALIDATION_ENABLED}
          OPENAI_IMAGE_GRID_MAX_RETRIES=${OPENAI_IMAGE_GRID_MAX_RETRIES}
          OPENAI_IMAGE_SETUP_MODEL=${OPENAI_IMAGE_SETUP_MODEL}
          OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS=${OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS}
          ENCOUNTER_MAP_STORAGE_DIR=${ENCOUNTER_MAP_STORAGE_DIR}
          OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
          OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL}
          OPENCODE_GO_THINKING=${OPENCODE_GO_THINKING}
          OPENCODE_GO_REASONING_EFFORT=${OPENCODE_GO_REASONING_EFFORT}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL}
          GEMINI_EMBEDDINGS_ENABLED=${GEMINI_EMBEDDINGS_ENABLED}
          GEMINI_EMBEDDING_DIMENSIONS=${GEMINI_EMBEDDING_DIMENSIONS}
          MEMORY_EMBEDDING_DEDUPE_THRESHOLD=${MEMORY_EMBEDDING_DEDUPE_THRESHOLD}
          MEMORY_EMBEDDING_SEARCH_WEIGHT=${MEMORY_EMBEDDING_SEARCH_WEIGHT}
          EOF

          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${TS_SERVER}" "\
            cd '${DEPLOY_PATH}' && \
            docker build -t dnd-app:${IMAGE_TAG} . && \
            sed -i 's|image:[[:space:]]*dnd-app:.*|image: dnd-app:${IMAGE_TAG}|g' docker-compose.yml && \
            docker compose --env-file .deploy.env up -d --scale worker=${WORKER_REPLICAS} && \
            docker compose --env-file .deploy.env ps worker && \
            for attempt in \$(seq 1 30); do \
              if docker compose --env-file .deploy.env exec -T app python -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5).read().decode())\"; then \
                break; \
              fi; \
              if [ \"\$attempt\" -eq 30 ]; then \
                docker compose --env-file .deploy.env ps; \
                docker compose --env-file .deploy.env logs --tail=200 app; \
                exit 1; \
              fi; \
              sleep 2; \
            done && \
            docker image prune -af \
          "
