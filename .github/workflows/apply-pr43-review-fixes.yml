name: Apply PR 43 review fixes

on:
  push:
    branches:
      - fix/dm-timeout-phase-split
    paths:
      - tools/apply_pr43_review_fixes.py
      - .github/workflows/apply-pr43-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dm-timeout-phase-split
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply edits
        run: python tools/apply_pr43_review_fixes.py
      - name: Syntax check
        run: |
          python -m py_compile \
            automation/dm_response_state.py \
            automation/run_automation_worker.py \
            automation/run_autonomous_llm_campaign.py \
            automation/test_dm_response_state.py \
            automation/test_run_automation_worker.py \
            server/tests/test_p0_fixes.py
      - name: Commit fixes and remove one-shot files
        run: |
          rm tools/apply_pr43_review_fixes.py
          rm .github/workflows/apply-pr43-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix timeout reconciliation and audit ordering review findings"
          git push origin HEAD:fix/dm-timeout-phase-split
