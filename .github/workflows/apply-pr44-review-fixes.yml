name: Apply PR 44 review fixes

on:
  push:
    branches:
      - feature/sqlite-concurrency-hardening
    paths:
      - tools/apply_pr44_review_fixes.py
      - .github/workflows/apply-pr44-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sqlite-concurrency-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply edits
        run: python tools/apply_pr44_review_fixes.py
      - name: Syntax check
        run: |
          python -m py_compile \
            server/sqldb_config.py \
            server/app.py \
            server/services/automation_service.py \
            server/tests/test_sqlite_hardening.py
      - name: Commit fixes and remove one-shot files
        run: |
          rm tools/apply_pr44_review_fixes.py
          rm .github/workflows/apply-pr44-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SQLite retry and engine initialization review findings"
          git push origin HEAD:feature/sqlite-concurrency-hardening
