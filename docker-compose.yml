services:
  app:
    build: .
    image: dnd-app:latest
    ports:
      - "${APP_PORT:-5889}:5001"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      PORT: 5001
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-420}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-gthread}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      WEB_THREADS: ${WEB_THREADS:-12}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/dnd.db}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5889}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      SSO_URL: ${SSO_URL:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-dnd_session}
      AUTH_SESSION_LIFETIME_DAYS: ${AUTH_SESSION_LIFETIME_DAYS:-30}
      OAUTH_STATE_LIFETIME_MINUTES: ${OAUTH_STATE_LIFETIME_MINUTES:-10}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DND_API_BASE: ${DND_API_BASE:-http://127.0.0.1:5001}
      LLM_CAMPAIGN_ENV_FILE: ${LLM_CAMPAIGN_ENV_FILE:-/app/data/automation/llm_campaign.env}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-low}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-240}
      OPENAI_IMAGE_QA_ENABLED: ${OPENAI_IMAGE_QA_ENABLED:-true}
      OPENAI_IMAGE_QA_MODEL: ${OPENAI_IMAGE_QA_MODEL:-gpt-5.4}
      OPENAI_IMAGE_QA_THRESHOLD: ${OPENAI_IMAGE_QA_THRESHOLD:-8}
      OPENAI_IMAGE_QA_MAX_RETRIES: ${OPENAI_IMAGE_QA_MAX_RETRIES:-1}
      OPENAI_IMAGE_QA_TIMEOUT_SECONDS: ${OPENAI_IMAGE_QA_TIMEOUT_SECONDS:-90}
      OPENAI_IMAGE_GRID_VALIDATION_ENABLED: ${OPENAI_IMAGE_GRID_VALIDATION_ENABLED:-true}
      OPENAI_IMAGE_GRID_MAX_RETRIES: ${OPENAI_IMAGE_GRID_MAX_RETRIES:-2}
      OPENAI_IMAGE_SETUP_MODEL: ${OPENAI_IMAGE_SETUP_MODEL:-gpt-5.4}
      OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS: ${OPENAI_IMAGE_SETUP_TIMEOUT_SECONDS:-90}
      ENCOUNTER_MAP_STORAGE_DIR: ${ENCOUNTER_MAP_STORAGE_DIR:-/app/data/encounter_maps}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-}
      OPENCODE_GO_THINKING: ${OPENCODE_GO_THINKING:-disabled}
      OPENCODE_GO_REASONING_EFFORT: ${OPENCODE_GO_REASONING_EFFORT:-high}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDINGS_ENABLED: ${GEMINI_EMBEDDINGS_ENABLED:-true}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      MEMORY_EMBEDDING_DEDUPE_THRESHOLD: ${MEMORY_EMBEDDING_DEDUPE_THRESHOLD:-0.90}
      MEMORY_EMBEDDING_SEARCH_WEIGHT: ${MEMORY_EMBEDDING_SEARCH_WEIGHT:-0.70}
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
